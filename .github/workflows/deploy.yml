# main 브랜치에 push 하면 자동으로
#  1) GitHub Pages 에 배포 (설정 없이 바로 동작 → https://<아이디>.github.io/pocket-jungle/)
#  2) Firebase Hosting + Firestore 규칙 배포 (시크릿 FIREBASE_SERVICE_ACCOUNT 를 넣으면 켜짐)
# Firebase 웹 설정은 nuxt.config.ts 에 들어 있음. 저장소 Variables 로 덮어쓸 수도 있음
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: deploy
  cancel-in-progress: true

env:
  FIREBASE_PROJECT: ${{ vars.FIREBASE_PROJECT_ID || 'pocket-jungle' }}

jobs:
  pages:
    name: GitHub Pages
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run generate
        env:
          NUXT_APP_BASE_URL: /${{ github.event.repository.name }}/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .output/public
      - id: deployment
        uses: actions/deploy-pages@v4

  firebase:
    name: Firebase Hosting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run generate
      - name: Deploy to Firebase (Hosting + Firestore rules)
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$SA" ]; then
            echo "::warning::FIREBASE_SERVICE_ACCOUNT 시크릿이 없어 Firebase 배포를 건너뜁니다 (README 참고)"
            exit 0
          fi
          printf '%s' "$SA" > "$RUNNER_TEMP/sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          npx --yes firebase-tools@latest deploy --only hosting,firestore \
            --project "$FIREBASE_PROJECT" --non-interactive
